[project]
name = "jirrabit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.1",
    "django-htmx==1.29.0",
    "pillow==12.3.0",
    "psycopg[binary]==3.3.6",
    "django-ninja==1.7.1",
    "channels==4.3.2",
    "markdown==3.11",
    "bleach==6.4.0",
    "channels-redis==4.3.0",
    "saltare==1.12.0",
    "blacknoise==1.2.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "django-stubs-ext>=6.1.1",
    "ruff==0.16.9",
    "ty==0.0.84",
]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = [
    ".venv",
    "migrations",
    "staticfiles",
    "locale",
    "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
ignore = [
    "E501",  # long lines handled by formatter
    "B008",  # default args in Django settings
]

[tool.ruff.lint.per-file-ignores]
"jirrabit/settings.py" = ["F401"]
"**/migrations/*.py" = ["E", "F", "W", "I", "UP", "B"]
"tests/*.py" = ["B"]

[tool.ty.src]
include = ["accounts", "board", "core", "issues", "jirrabit", "projects", "realtime", "search"]
exclude = ["**/migrations/**", "**/.venv/**", "staticfiles"]

[tool.ty.rules]
# django-stubs is a dev dependency and teaches ty the model layer, which took the
# diagnostic count from 436 to 113. What is left falls into four groups, none of
# which is a defect in this codebase. They are enumerated so a future reader can
# tell "suppressed and understood" apart from "suppressed because it was noisy":
#
#   1. Custom manager methods. Project.objects.filter_visible() is 13 of them.
#   2. Django's implicit <fk>_id attributes, e.g. issue.status_id.
#   3. Attributes a third party attaches at runtime: request.htmx comes from
#      django-htmx's middleware and django_htmx ships no type information.
#   4. Form field attributes assigned at runtime, e.g. form.fields["x"].queryset.
unresolved-attribute = "ignore"

# jirrabit replaces Django's generic class-based views with async ones, so
# `async def get` overrides a base class whose `get` is declared to return
# HttpResponse. That is the architecture rather than an accident — see
# core/async_views.py — and no annotation can say "this override is dispatched
# by ASGI". A narrower fix would be per-line suppressions across every view.
invalid-method-override = "ignore"
