name: CI

# Run on every PR push. ``concurrency`` cancels in-flight jobs from the
# previous commit on the same PR so we don't burn minutes on stale code.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ruff · ty · check · tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      JIRRABIT_DEBUG: "1"
      JIRRABIT_SECRET_KEY: ci-only-not-secret
      JIRRABIT_ALLOWED_HOSTS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .
        # 46 files in this repository were committed unformatted while only
        # ``ruff check`` ran, so the formatter drifted a long way from the lint
        # gate. Formatting them was its own commit; this keeps it from
        # happening again.

      - name: ty (type-check)
        run: uv run ty check .
        # Was ``|| true`` until django-stubs became a dev dependency. With it,
        # the 436 diagnostics it used to report were 401 cases of ty not
        # understanding that Model.objects and Model.DoesNotExist are added by
        # the metaclass, and the rest were downstream of the same confusion.
        # What is genuinely invisible to it is now three documented rule
        # suppressions in pyproject.toml, each with its reasons, plus one
        # per-line suppression where an async view deliberately awaits a sync
        # base method. Pinned ty==0.0.38 so a new release cannot change the
        # verdict on an unrelated commit.

      - name: Django system check
        run: JIRRABIT_DB_ENGINE=sqlite uv run python manage.py check

      - name: Django migrations consistency
        run: JIRRABIT_DB_ENGINE=sqlite uv run python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: JIRRABIT_DB_ENGINE=sqlite uv run python manage.py test tests
