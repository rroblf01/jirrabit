services:
  jirrabit-db:
    # On a self-hosted box a container that stays down after a daemon restart is
    # worse than one that crashes: nothing says why. Every long-lived service
    # here is unless-stopped, matching the MCP service.
    restart: unless-stopped
    image: postgres:18.3-alpine3.23
    env_file:
      - .env
    volumes:
      # Mount at /var/lib/postgresql, not /var/lib/postgresql/data. Postgres 18
      # images store data under a major-version subdirectory
      # (PGDATA=/var/lib/postgresql/18/docker) and refuse to start if a mount
      # lands on the old single-directory path.
      - jirrabitdata:/var/lib/postgresql
    healthcheck:
      # POSTGRES_USER, not JIRRABIT_DB_USER: the former is the variable the
      # postgres image actually reads, the latter exists nowhere in the project
      # and only ever matched because its fallback happens to be the same word.
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-jirrabit}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:8.6.3-alpine3.23
    env_file:
      - .env
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    restart: unless-stopped
    build: .
    env_file:
      - .env
    depends_on:
      jirrabit-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    # command: ["daphne"]
    command: ["saltare-dev"]

  # The MCP server, from the submodule this repository pins. Behind a profile so
  # that `docker compose up -d` stays a fast Python-only loop and does not pay
  # for a Go build; opt in with `--profile mcp`.
  #
  #   docker compose --profile mcp up -d
  #
  # On the same compose network as `web`, so an agent can address this instance
  # as http://web:8000 — and `web` is in JIRRABIT_ALLOWED_HOSTS for exactly that
  # reason. The service has no default instance of its own: every tool call
  # carries its own instanceUrl and apiKey, so a user creates a key in their
  # profile and passes it per call.
  jirrabit-mcp:
    profiles: ["mcp"]
    build:
      # The submodule path is the default. Override MCP_CONTEXT in .env to
      # build from a checkout elsewhere, e.g. a sibling clone while developing.
      context: ${MCP_CONTEXT:-./jirrabit-mcp}
    restart: unless-stopped
    command: ["-transport", "http"]
    environment:
      JIRRABIT_MCP_TRANSPORT: http
      JIRRABIT_MCP_ADDR: ":8082"
      JIRRABIT_MCP_PATH: /mcp
    ports:
      # For an MCP client running on the host, connecting over HTTP. A client
      # that spawns the binary itself needs no port: it talks stdio.
      - "8082:8082"
    extra_hosts:
      # Lets this container reach a jirrabit on the Docker host, for the case
      # where the target is not the `web` service above.
      - "host.docker.internal:host-gateway"

volumes:
  jirrabitdata:
